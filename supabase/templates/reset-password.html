<div style="font-family:Inter,Arial,sans-serif;color:#12201a;max-width:480px;margin:0 auto;padding:24px">
<h2 style="margin:0 0 12px">Reset your password</h2>
<p>Someone asked to reset the password for your ShopHub store. If that was you, choose a new password below. The link works once and expires in one hour.</p>
<p style="margin:24px 0"><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#0b3d2c;color:#ffffff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600">Choose a new password</a></p>
<p style="color:#5d6b63;font-size:14px">If you didn’t ask for this, you can ignore this email. Your password won’t change.</p>
<p style="color:#5d6b63;font-size:13px;margin-top:32px">ShopHub</p>
</div>
